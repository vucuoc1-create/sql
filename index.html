<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetricsHub Dashboard - Refactored</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- 1. NAVBAR (Sử dụng Flexbox) -->
    <nav class="navbar-flex">
        <div class="nav-logo">Logo</div>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">VeryLongGermanWordForDashboard</a>
            <a href="#">Contact</a>
        </div>
        <div class="nav-profile">Profile</div>
    </nav>

    <!-- 2. DASHBOARD (Sử dụng CSS Grid dạng Bento Box, làm phẳng DOM) -->
    <main class="dashboard-grid">
        <div class="widget widget-large">Chart A (Span 2 rows)</div>
        <div class="widget">Chart B</div>
        <div class="widget">Chart C</div>
        <div class="widget">Chart D</div>
    </main>

    <!-- 3. PRICING SECTION (Sử dụng hệ thống 12 cột của Bootstrap 5) -->
    <section class="container py-5">
        <div class="row g-4">
            <div class="col-12 col-md-4">
                <div class="card h-100 shadow-sm text-center p-4">
                    <h3>Gói Cơ bản</h3>
                    <p class="text-muted">Dành cho cá nhân khởi đầu</p>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card h-100 shadow-sm text-center p-4 border-primary">
                    <h3>Gói Nâng cao</h3>
                    <p class="text-muted">Dành cho nhóm phát triển</p>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card h-100 shadow-sm text-center p-4">
                    <h3>Gói Doanh nghiệp</h3>
                    <p class="text-muted">Dành cho tổ chức lớn</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
