<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Bootstrap Gallery</title>
    <!-- Nhúng Bootstrap 5 CSS từ CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .gallery-img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 8px;
            transition: transform 0.3s ease;
        }
        .gallery-img:hover {
            transform: scale(1.03);
        }
    </style>
</head>
<body class="bg-light py-5">

    <div class="container">
        <h2 class="text-center mb-4">Responsive Image Gallery</h2>
        
        <div class="row g-4">
            <!-- Ảnh 1 -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card shadow-sm border-0">
                    <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e" class="gallery-img" alt="Gallery Image 1">
                </div>
            </div>
            
            <!-- Ảnh 2 -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card shadow-sm border-0">
                    <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05" class="gallery-img" alt="Gallery Image 2">
                </div>
            </div>
            
            <!-- Ảnh 3 -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card shadow-sm border-0">
                    <img src="https://images.unsplash.com/photo-1447752875215-b2761acb3c5d" class="gallery-img" alt="Gallery Image 3">
                </div>
            </div>
            
            <!-- Ảnh 4 -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card shadow-sm border-0">
                    <img src="https://images.unsplash.com/photo-1426604966848-d7adacbd02bff" class="gallery-img" alt="Gallery Image 4">
                </div>
            </div>
        </div>
    </div>

    <!-- Nhúng Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
